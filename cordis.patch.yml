# Bundle layer for @dr-co/dsh-skills.
#
# Installing the package mounts this row, so the plugin shows up in the
# settings plugin list where it can be switched off or removed like any other.
# Everything is resolved at runtime: the home from `$DSH_HOME`, the installation
# from the running CLI, and our own skills from `<home>/skills`. A profile that
# needs different paths (or a smaller upload cap) overrides this row by id.
- insert:
    - id: dsh-skills
      name: '@dr-co/dsh-skills'
      config:
        skillsDir: skills
        maxUploadBytes: 8388608
